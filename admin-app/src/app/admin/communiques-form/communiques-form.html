<div class="max-w-3xl mx-auto py-12 px-4">
  <div class="bg-white rounded-2xl shadow-xl p-8">
    <div class="admin-form-head">
      <h1 class="text-3xl font-bold text-green-700">Ajouter un communiqué officiel</h1>
      <p class="text-sm text-gray-500 mt-1">Publiez un communiqué, document ou image officielle.</p>
    </div>

    <div *ngIf="success()" class="mt-6 mb-6 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg">
      {{ success() }}
    </div>
    <div *ngIf="error()" class="mt-6 mb-6 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
      {{ error() }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-8 mt-6">

      <!-- Titre -->
      <div>
        <label for="title" class="block font-medium mb-2">Titre *</label>
        <input
          id="title"
          type="text"
          formControlName="title"
          class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-500 outline-none"
          [class.border-red-500]="form.get('title')?.touched && form.get('title')?.invalid"
        >
        <p *ngIf="form.get('title')?.touched && form.get('title')?.errors?.['required']" class="text-red-600 text-sm mt-1">
          Le titre est requis
        </p>
        <p *ngIf="form.get('title')?.touched && form.get('title')?.errors?.['minlength']" class="text-red-600 text-sm mt-1">
          Minimum {{ form.get('title')?.errors?.['minlength']?.requiredLength }} caractères
        </p>
      </div>

      <!-- Description -->
      <div>
        <label for="description" class="block font-medium mb-2">Description (optionnel)</label>
        <textarea
          id="description"
          formControlName="description"
          rows="4"
          class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-500 outline-none"
        ></textarea>
      </div>

      <!-- ============================================== -->
      <!-- FICHIER -->
      <!-- ============================================== -->
      <div class="border-t pt-6">
        <label class="flex items-center gap-2 font-medium mb-3">
          <app-icon name="document-text" class="w-5 h-5 text-green-600"></app-icon>
          Document / Image *
        </label>

        <div *ngIf="!selectedFileName()"
             class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-green-400 transition">
          <input id="file" type="file" (change)="onFileChange($event)" accept=".pdf,.jpg,.jpeg,.png" class="w-full">
        </div>

        <div *ngIf="selectedFileName() && !selectedFilePreviewUrl()"
             class="flex items-center justify-between gap-3 border border-gray-200 rounded-xl px-4 py-3">
          <span class="flex items-center gap-2 text-sm text-gray-700 truncate">
            <app-icon name="document-text" class="w-4 h-4 text-green-600 shrink-0"></app-icon>
            {{ selectedFileName() }}
          </span>
          <button type="button" (click)="removeFile()"
                  class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center hover:bg-red-50 text-red-600">
            <app-icon name="x-mark" class="w-4 h-4"></app-icon>
          </button>
        </div>

        <div *ngIf="selectedFilePreviewUrl()" class="relative inline-block">
          <img [src]="selectedFilePreviewUrl()" class="h-40 w-auto rounded-xl object-cover shadow">
          <button type="button" (click)="removeFile()"
                  class="absolute -top-2 -right-2 w-7 h-7 bg-white rounded-full shadow flex items-center justify-center hover:bg-red-50 text-red-600">
            <app-icon name="x-mark" class="w-4 h-4"></app-icon>
          </button>
        </div>

        <p *ngIf="form.get('file')?.touched && form.get('file')?.errors?.['required']" class="text-red-600 text-sm mt-1">
          Un fichier est requis
        </p>
      </div>

      <!-- Bouton -->
      <button
        type="submit"
        [disabled]="loading() || form.invalid"
        class="w-full bg-green-600 text-white py-4 px-6 rounded-xl font-semibold hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 disabled:opacity-60 disabled:cursor-not-allowed transition"
      >
        {{ loading() ? 'Enregistrement...' : 'Publier le communiqué' }}
      </button>
    </form>
  </div>
</div>
