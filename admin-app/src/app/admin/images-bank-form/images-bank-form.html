<div class="max-w-3xl mx-auto py-12 px-4">
  <div class="bg-white rounded-2xl shadow-xl p-8">
    <div class="admin-form-head">
      <h1 class="text-3xl font-bold text-green-700">Ajouter une Image</h1>
      <p class="text-sm text-gray-500 mt-1">Ajoutez une photo à la banque d'images du site public.</p>
    </div>

    <div *ngIf="success()" class="mt-6 mb-6 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg">
      {{ success() }}
    </div>
    <div *ngIf="error()" class="mt-6 mb-6 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
      {{ error() }}
    </div>

    <form [formGroup]="form" (submit)="onSubmit(); $event.preventDefault()" class="space-y-8 mt-6">
      <div>
        <label class="block font-medium mb-2">Titre *</label>
        <input type="text" formControlName="title" class="w-full border rounded-lg px-4 py-3" [class.border-red-500]="isInvalid('title')">
      </div>

      <div>
        <label class="block font-medium mb-2">Catégorie</label>
        <input type="text" formControlName="category" placeholder="Ex: Événements, Infrastructures..." class="w-full border rounded-lg px-4 py-3">
      </div>

      <!-- ============================================== -->
      <!-- IMAGE -->
      <!-- ============================================== -->
      <div class="border-t pt-6">
        <label class="flex items-center gap-2 font-medium mb-3">
          <app-icon name="photo" class="w-5 h-5 text-green-600"></app-icon>
          Image *
        </label>

        <div *ngIf="!imagePreviewUrl()"
             class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-green-400 transition">
          <input id="image" type="file" accept="image/*" (change)="onImageChange($event)" class="w-full">
        </div>

        <div *ngIf="imagePreviewUrl()" class="relative inline-block">
          <img [src]="imagePreviewUrl()" class="h-40 w-auto rounded-xl object-cover shadow">
          <button type="button" (click)="removeImage()"
                  class="absolute -top-2 -right-2 w-7 h-7 bg-white rounded-full shadow flex items-center justify-center hover:bg-red-50 text-red-600">
            <app-icon name="x-mark" class="w-4 h-4"></app-icon>
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="loading()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-4 rounded-xl">
        {{ loading() ? 'Enregistrement...' : "Ajouter l'image" }}
      </button>
    </form>
  </div>
</div>
