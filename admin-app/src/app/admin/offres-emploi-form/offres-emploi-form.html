<div class="max-w-3xl mx-auto py-12 px-4">
  <div class="bg-white rounded-2xl shadow-xl p-8">

    <div class="admin-form-head">
      <h1 class="text-3xl font-bold text-green-700">
        Nouvelle Offre d'Emploi
      </h1>
      <p class="text-sm text-gray-500 mt-1">
        Publiez une offre d'emploi avec le fichier PDF et une image de couverture.
      </p>
    </div>

    <div *ngIf="success()" class="mt-6 mb-6 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg">
      {{ success() }}
    </div>
    <div *ngIf="error()" class="mt-6 mb-6 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
      {{ error() }}
    </div>

    <form [formGroup]="form" (submit)="onSubmit(); $event.preventDefault()" class="space-y-8 mt-6">

      <div>
        <label class="block font-medium mb-2">Titre de l'offre *</label>
        <input type="text" formControlName="title"
               placeholder="Ex: Infirmier Diplômé - Service de Dialyse"
               class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-500 outline-none"
               [class.border-red-500]="isInvalid('title')">
        <p *ngIf="isInvalid('title')" class="text-red-600 text-sm mt-1">Le titre est obligatoire.</p>
      </div>

      <div>
        <label class="block font-medium mb-2">Structure / Employeur *</label>
        <input type="text" formControlName="company"
               placeholder="Ex: Centre de Santé Urbain de Dakar"
               class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-500 outline-none"
               [class.border-red-500]="isInvalid('company')">
      </div>

      <div>
        <label class="block font-medium mb-2">Lieu</label>
        <input type="text" formControlName="location"
               placeholder="Ex: Dakar, Thiès, Saint-Louis..."
               class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-500 outline-none">
      </div>

      <div>
        <label class="block font-medium mb-2">Date limite de dépôt</label>
        <input type="date" formControlName="deadline"
               class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-500 outline-none">
      </div>

      <div>
        <label class="block font-medium mb-2">Description / Détails du poste</label>
        <textarea rows="6" formControlName="description"
                  placeholder="Décrivez le poste, les qualifications requises, les avantages..."
                  class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-500 outline-none"></textarea>
      </div>

      <!-- ============================================== -->
      <!-- FICHIER PDF -->
      <!-- ============================================== -->
      <div class="border-t pt-6">
        <label class="flex items-center gap-2 font-medium mb-3">
          <app-icon name="document-text" class="w-5 h-5 text-green-600"></app-icon>
          Fichier PDF de l'offre *
        </label>

        <div *ngIf="!selectedPdf()"
             class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-green-400 transition">
          <input id="file" type="file" accept=".pdf" (change)="onPdfChange($event)" class="w-full">
        </div>

        <div *ngIf="selectedPdf()" class="flex items-center justify-between gap-3 border border-gray-200 rounded-xl px-4 py-3">
          <span class="flex items-center gap-2 text-sm text-gray-700 truncate">
            <app-icon name="document-text" class="w-4 h-4 text-green-600 shrink-0"></app-icon>
            {{ selectedPdf() }}
          </span>
          <button type="button" (click)="removePdf()"
                  class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center hover:bg-red-50 text-red-600">
            <app-icon name="x-mark" class="w-4 h-4"></app-icon>
          </button>
        </div>
      </div>

      <!-- ============================================== -->
      <!-- IMAGE DE COUVERTURE -->
      <!-- ============================================== -->
      <div class="border-t pt-6">
        <label class="flex items-center gap-2 font-medium mb-3">
          <app-icon name="photo" class="w-5 h-5 text-green-600"></app-icon>
          Image de couverture (optionnel)
        </label>
        <p class="text-xs text-gray-500 mb-3">Recommandé : format paysage ou carré (600x400 px)</p>

        <div *ngIf="!coverPreviewUrl()"
             class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-green-400 transition">
          <input id="cover" type="file" accept=".jpg,.jpeg,.png,.webp" (change)="onCoverChange($event)" class="w-full">
        </div>

        <div *ngIf="coverPreviewUrl()" class="relative inline-block">
          <img [src]="coverPreviewUrl()" class="h-40 w-auto rounded-xl object-cover shadow">
          <button type="button" (click)="removeCover()"
                  class="absolute -top-2 -right-2 w-7 h-7 bg-white rounded-full shadow flex items-center justify-center hover:bg-red-50 text-red-600">
            <app-icon name="x-mark" class="w-4 h-4"></app-icon>
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="loading()"
              class="w-full bg-green-600 hover:bg-green-700 disabled:opacity-60 text-white font-semibold py-4 rounded-xl transition">
        {{ loading() ? 'Publication en cours...' : "Publier l'Offre d'Emploi" }}
      </button>
    </form>
  </div>
</div>
